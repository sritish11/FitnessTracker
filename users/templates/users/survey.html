{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Diet Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // BMI Calculator
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');
            const ageInput = document.getElementById('age');
            const goalSelect = document.getElementById('goal');
            const activitySelect = document.getElementById('activity_level');
            const bmiResult = document.getElementById('bmi-result');
            const bmiCategory = document.getElementById('bmi-category');
            const formElements = [heightInput, weightInput, ageInput, goalSelect, activitySelect];
            
            // Calculate BMI when height or weight changes
            function calculateBMI() {
                if (heightInput.value && weightInput.value) {
                    const height = parseFloat(heightInput.value) / 100; // convert cm to m
                    const weight = parseFloat(weightInput.value);
                    if (height > 0 && weight > 0) {
                        const bmi = (weight / (height * height)).toFixed(1);
                        bmiResult.textContent = bmi;
                        
                        // Update BMI category
                        if (bmi < 18.5) {
                            bmiCategory.textContent = 'Underweight';
                            bmiCategory.className = 'text-blue-500';
                        } else if (bmi < 25) {
                            bmiCategory.textContent = 'Normal';
                            bmiCategory.className = 'text-green-500';
                        } else if (bmi < 30) {
                            bmiCategory.textContent = 'Overweight';
                            bmiCategory.className = 'text-yellow-500';
                        } else {
                            bmiCategory.textContent = 'Obese';
                            bmiCategory.className = 'text-red-500';
                        }
                        
                        document.getElementById('bmi-container').classList.remove('hidden');
                    }
                }
            }
            
            // Update form completion progress
            function updateProgress() {
                let filled = 0;
                formElements.forEach(element => {
                    if (element.value) filled++;
                });
                
                const percentage = (filled / formElements.length) * 100;
                document.getElementById('progress-bar').style.width = percentage + '%';
                
                // Enable submit button if form is complete
                if (percentage === 100) {
                    document.getElementById('submit-btn').disabled = false;
                    document.getElementById('submit-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                    document.getElementById('submit-btn').classList.add('hover:bg-blue-600');
                } else {
                    document.getElementById('submit-btn').disabled = true;
                    document.getElementById('submit-btn').classList.add('opacity-50', 'cursor-not-allowed');
                    document.getElementById('submit-btn').classList.remove('hover:bg-blue-600');
                }
            }
            
            // Update recommendation based on goal selection
            function updateRecommendation() {
                const goal = goalSelect.value;
                const recommendationElement = document.getElementById('recommendation');
                
                if (goal === 'muscle_gain') {
                    recommendationElement.textContent = 'Focus on protein-rich foods and strength training';
                    recommendationElement.className = 'text-blue-600 text-sm mt-1';
                } else if (goal === 'weight_loss') {
                    recommendationElement.textContent = 'Create a calorie deficit with balanced nutrition';
                    recommendationElement.className = 'text-green-600 text-sm mt-1';
                } else {
                    recommendationElement.textContent = 'Balanced nutrition to maintain current weight';
                    recommendationElement.className = 'text-purple-600 text-sm mt-1';
                }
            }
            
            // Add event listeners to all form elements
            heightInput.addEventListener('input', function() {
                calculateBMI();
                updateProgress();
            });
            
            weightInput.addEventListener('input', function() {
                calculateBMI();
                updateProgress();
            });
            
            ageInput.addEventListener('input', updateProgress);
            
            goalSelect.addEventListener('change', function() {
                updateProgress();
                updateRecommendation();
            });
            
            activitySelect.addEventListener('change', updateProgress);
            
            // Initialize form
            updateProgress();
        });
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-semibold text-center text-gray-800">Find Your Diet Plan</h1>
        
        <!-- Progress indicator -->
        <div class="mt-4 mb-2">
            <p class="text-sm text-gray-500 mb-1">Form completion</p>
            <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div id="progress-bar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
        
        <form action="" method="POST" class="mt-4">
            {% csrf_token %}
            
            <label class="block mb-2 text-gray-700">Age</label>
            <input type="number" name="age" id="age" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
            
            <label class="block mt-4 mb-2 text-gray-700">Height (cm)</label>
            <input type="number" name="height" id="height" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
            
            <label class="block mt-4 mb-2 text-gray-700">Weight (kg)</label>
            <input type="number" name="weight" id="weight" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
            
            <!-- BMI Display -->
            <div id="bmi-container" class="mt-2 p-2 bg-gray-50 rounded-lg hidden">
                <div class="flex justify-between">
                    <p class="text-sm text-gray-600">Your BMI:</p>
                    <p class="text-sm font-medium"><span id="bmi-result">0</span> - <span id="bmi-category">Unknown</span></p>
                </div>
            </div>

            <label class="block mt-4 mb-2 text-gray-700">Goal</label>
            <select name="goal" id="goal" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                <option value="">Select your goal</option>
                <option value="muscle_gain">Muscle Gain</option>
                <option value="weight_loss">Weight Loss</option>
                <option value="maintenance">Maintenance</option>
            </select>
            <p id="recommendation" class="text-sm mt-1 text-gray-500"></p>

            <label class="block mt-4 mb-2 text-gray-700">Activity Level</label>
            <select name="activity_level" id="activity_level" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                <option value="">Select your activity level</option>
                <option value="low">Low (Little to no exercise)</option>
                <option value="moderate">Moderate (3-5 days/week exercise)</option>
                <option value="high">High (6-7 days/week exercise)</option>
            </select>

            <button id="submit-btn" type="submit" disabled class="mt-6 w-full bg-blue-500 text-white py-2 rounded-lg transition opacity-50 cursor-not-allowed">
                Get Diet Plan
            </button>
        </form>
        
        <!-- Quick tips -->
        <div class="mt-4 text-sm text-gray-500">
            <p class="mb-1 font-medium">Quick Tips:</p>
            <ul class="list-disc pl-5 space-y-1">
                <li class="cursor-pointer hover:text-blue-500 transition">Enter accurate height and weight for best results</li>
                <li class="cursor-pointer hover:text-blue-500 transition">Your activity level affects calorie needs</li>
                <li class="cursor-pointer hover:text-blue-500 transition">Diet plans are customized to your goal</li>
            </ul>
        </div>
    </div>

</body>
</html>
