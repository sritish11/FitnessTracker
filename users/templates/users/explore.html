{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore | FitSocial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-6" x-data="{ openProfile: false, profileHTML: '', loading: false }">

  <div class="w-full max-w-lg bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-2xl p-8 text-white">
    <h2 class="text-2xl font-semibold text-center text-indigo-300 mb-6">🔍 Explore Users</h2>

    <!-- Search form -->
    <form method="POST" class="flex gap-3 justify-center mb-6">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Enter username..."
             class="flex-1 px-4 py-2 rounded bg-white/20 text-white placeholder-indigo-200 focus:ring-2 focus:ring-indigo-400 outline-none">
      <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-semibold shadow transition">
        Search
      </button>
    </form>

    <!-- Results -->
    {% if found_user %}
      <div id="resultCard" class="bg-white/20 p-4 rounded-lg shadow-inner text-center animate-fade-in">
        <p class="text-xl font-bold text-indigo-200 mb-2">{{ found_user.username }}</p>

        <div class="flex justify-center gap-4">
          <!-- Add Friend -->
          <form method="post" action="/friend-requests/" class="inline-block">
  {% csrf_token %}
  <input type="hidden" name="friend_code" value="{{ found_user.username }}">
  <button type="submit"
          class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-full text-white font-semibold transition">
    ➕ Add Friend
  </button>
</form>


          <!-- View Profile -->
          <button @click="
            loading = true;
            fetch('/profile/{{ found_user.username }}/?ajax=1')
              .then(res => res.text())
              .then(html => {
                profileHTML = html;
                openProfile = true;
                loading = false;
              })
              .catch(() => {
                profileHTML = '<div class=\'text-red-400 text-center\'>Failed to load profile 😢</div>';
                openProfile = true;
                loading = false;
              })
          "
                  class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-full text-white font-semibold transition">
            👁️ View Profile
          </button>
        </div>
      </div>
    {% elif error %}
      <p class="text-center text-red-400 mt-4">{{ error }}</p>
    {% elif not_found %}
      <p class="text-center text-indigo-200 mt-4 italic">User not found 😔</p>
    {% endif %}
  </div>

  <!-- Profile Modal -->
   <div x-show="openProfile" class="fixed inset-0 bg-black/70 flex justify-center items-center z-50 transition-opacity duration-300">
    <div class="bg-gray-900 rounded-2xl overflow-hidden w-full max-w-4xl p-6 relative">
      <button @click="openProfile = false"
              class="absolute top-4 right-4 text-white text-xl font-bold">✖️</button>
      <template x-if="loading">
        <div class="text-white text-center text-lg">Loading profile...</div>
      </template>
      <div x-html="profileHTML" x-show="!loading"></div>
    </div>
  </div>
</body>
</html>
