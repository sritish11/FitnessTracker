<div class="max-w-xl mx-auto space-y-6">
  {% for post in posts %}
    <div class="bg-white shadow-md rounded-2xl p-4">
      <p class="font-semibold">{{ post.user.username }}</p>
      <p class="mt-2">{{ post.content }}</p>
      {% if post.image %}
        <img src="{{ post.image.url }}" class="mt-3 rounded-lg shadow-md">
      {% endif %}
      <div class="flex justify-between mt-4 text-sm text-gray-600">
        <a href="{% url 'like_post' post.id %}">❤️ {{ post.total_likes }}</a>
        <span>💬 {{ post.total_comments }}</span>
      </div>
      <form method="post" action="{% url 'comment_post' post.id %}" class="mt-2">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Write a comment..."
               class="w-full border rounded-lg p-2">
      </form>
      <div class="mt-2 space-y-1">
        {% for comment in post.comments.all %}
          <p><b>{{ comment.user.username }}</b>: {{ comment.text }}</p>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
