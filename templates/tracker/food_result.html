<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Nutrition result of scanned food." />
  <title>Nutrition Result</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 flex items-center justify-center p-6">
  <i class="fas fa-dumbbell text-[8rem] text-indigo-300 opacity-20 absolute bottom-4 left-4 hidden md:block pointer-events-none select-none z-0"></i>

  <i class="fas fa-apple-alt text-[8rem] text-green-300 opacity-20 absolute top-4 right-4 hidden md:block pointer-events-none select-none z-0"></i>

  <i class="fas fa-carrot text-[6rem] text-orange-300 opacity-20 absolute top-24 left-12 hidden md:block pointer-events-none select-none z-0"></i>

  <i class="fas fa-bottle-water text-[6rem] text-blue-200 opacity-20 absolute bottom-24 right-12 hidden md:block pointer-events-none select-none z-0"></i>

  <i class="fas fa-basketball-ball text-[5rem] text-yellow-300 opacity-20 absolute top-1/2 left-2 hidden md:block pointer-events-none select-none z-0"></i>

  <i class="fas fa-running text-[6rem] text-purple-300 opacity-20 absolute bottom-12 left-1/3 hidden md:block pointer-events-none select-none z-0"></i>

  <!-- Broccoli -->
  <i class="fas fa-seedling text-[6rem] text-green-400 opacity-20 absolute bottom-8 left-1/2 hidden md:block pointer-events-none select-none z-0"></i>

<!-- Fish -->
  <i class="fas fa-fish text-[5rem] text-blue-300 opacity-20 absolute top-1/3 right-1/4 hidden md:block pointer-events-none select-none z-0"></i>

<!-- Bread -->
  <i class="fas fa-bread-slice text-[5rem] text-yellow-400 opacity-20 absolute bottom-1/3 left-1/4 hidden md:block pointer-events-none select-none z-0"></i>

  <!-- Sun (outdoor / energy) -->
  <i class="fas fa-sun text-[7rem] text-orange-200 opacity-20 absolute top-8 left-1/2 hidden md:block pointer-events-none select-none z-0"></i>

<!-- Bed (rest / recovery) -->
  <i class="fas fa-bed text-[6rem] text-indigo-200 opacity-20 absolute bottom-8 right-1/3 hidden md:block pointer-events-none select-none z-0"></i>
  
  <i class="fas fa-egg text-[5rem] text-yellow-200 opacity-20 absolute bottom-1/2 right-2 hidden md:block pointer-events-none select-none z-0"></i>
  <main class="max-w-md w-full mx-auto mt-4 bg-white rounded-3xl shadow-2xl overflow-hidden animate-fadeIn">
    <!-- Food Image with Overlay -->
    <div class="relative aspect-[4/3] w-full">
      <img src="{{ image_url }}" alt="{{ predicted_class }}" class="object-cover w-full h-full">
      <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/60 to-transparent p-4">
        <h2 class="text-white text-2xl font-bold drop-shadow-md">{{ predicted_class|title }}</h2>
      </div>
    </div>

    <!-- Nutrition Info -->
    <div class="p-6 space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-green-100 text-green-800 rounded-xl p-3 text-center shadow-sm">
          <p class="text-sm font-medium">Calories</p>
          <p class="text-xl font-bold">{{ calories }} kcal</p>
        </div>
        <div class="bg-blue-100 text-blue-800 rounded-xl p-3 text-center shadow-sm">
          <p class="text-sm font-medium">Protein</p>
          <p class="text-xl font-bold">{{ protein }} g</p>
        </div>
        <div class="bg-yellow-100 text-yellow-800 rounded-xl p-3 text-center shadow-sm">
          <p class="text-sm font-medium">Carbs</p>
          <p class="text-xl font-bold">{{ carbs }} g</p>
        </div>
        <div class="bg-purple-100 text-purple-800 rounded-xl p-3 text-center shadow-sm">
          <p class="text-sm font-medium">Fiber</p>
          <p class="text-xl font-bold">{{ fiber }} g</p>
        </div>
      </div>

      <!-- Back Button -->
      <a href="{% url 'dashboard' %}" class="block w-full py-3 mt-4 text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition transform hover:scale-105 focus:ring-2 focus:ring-indigo-300">
        ⬅ Back to Dashboard
      </a>
    </div>
  </main>
</body>
</html>
